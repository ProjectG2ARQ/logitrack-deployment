services:
  # ==========================================
  # Base de Datos Compartida
  # ==========================================
  mysqldb:
    image: mysql:8.4.0
    container_name: logitrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shipment_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - logitrack-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 1. Servidor de Configuración
  # ==========================================
  configserver:
    image: mauribz7/configserver:latest
    container_name: logitrack-configserver
    restart: on-failure
    ports:
      - "8085:8085"
    networks:
      - logitrack-net

  # ==========================================
  # 2. Servidor de Descubrimiento (Eureka)
  # ==========================================
  eureka-server:
    image: mauribz7/eureka-server:latest
    container_name: logitrack-eurekaserver
    restart: on-failure
    depends_on:
      configserver:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085/"
      SPRING_PROFILES_ACTIVE: "dev"
    ports:
      - "8065:8065"
    networks:
      - logitrack-net

  # ==========================================
  # 3. Microservicios de Dominio
  # ==========================================
  security-service:
    image: mauribz7/security-service:latest
    container_name: logitrack-security
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085/"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/security_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8065/eureka/"
    ports:
      - "8082:8082"
    networks:
      - logitrack-net

  courier-service:
    image: mauribz7/courier-service:latest
    container_name: logitrack-courier
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085/"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/courier_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8065/eureka/"
    ports:
      - "8081:8081"
    networks:
      - logitrack-net

  shipment-service:
    image: mauribz7/shipment-service:latest
    container_name: logitrack-shipment
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085/"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/shipment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8065/eureka/"
    ports:
      - "8080:8080"
    networks:
      - logitrack-net

  # ==========================================
  # 4. Puerta de Enlace (API Gateway)
  # ==========================================
  api-gateway:
    image: mauribz7/api-gateway:latest
    container_name: logitrack-gateway
    restart: on-failure
    depends_on:
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8085/"
      SPRING_PROFILES_ACTIVE: "dev"
      EUREKA_SERVER_URL: "http://eureka-server:8065/eureka/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8065/eureka/"
    ports:
      - "8066:8066"
    networks:
      - logitrack-net

  # ==========================================
  # 5. Capa de Presentación (Frontend SPA)
  # ==========================================
  logitrack-frontend:
    image: mauribz7/logitrack-frontend:latest
    container_name: logitrack-frontend
    restart: on-failure
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - logitrack-net

networks:
  logitrack-net:
    driver: bridge

volumes:
  mysql_data: